<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PopIT - Contacto | Asesoramiento y Soporte Tecnológico</title>
  <meta name="description"
    content="¿Necesitas asesoramiento tecnológico? Contáctanos a través de nuestro formulario. Respuestas rápidas y soluciones personalizadas de PopIT." />
  <meta name="keywords"
    content="PopIT contacto, formulario, soporte tecnológico, asesoramiento, escribir, teléfono, email" />
  <link rel="canonical" href="https://pauli-paz.github.io/proyecto-popit/paginas/contacto.html" />

  <meta property="og:title" content="PopIT | Contacta con Nuestros Expertos" />
  <meta property="og:description" content="Estamos listos para ayudarte con tus proyectos de innovación tecnológica." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://pauli-paz.github.io/proyecto-popit/paginas/contacto.html" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!--Link CSS----- -->
  <link rel="stylesheet" href="../css/estilos.css" />
</head>

<body>

  <!-- Header----- -->
  <nav class="navbar navbar-expand-sm bg-body-tertiary">
    <div class="container-fluid">
      <!-- LOGO -->
      <a class="navbar-brand" href="../index.html">
        <img src="../recursos/popit_logo_header.png" alt="PopIT Logo">
      </a>

      <!-- Button mobile -->
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
        aria-controls="navbarNav" aria-expanded="false" aria-label="Abrir menú de navegación">
        <!-- CORREGIDO: aria-label descriptivo -->
        <span class="navbar-toggler-icon"></span>
      </button>

      <!-- LINKS -->
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="../index.html" aria-label="Ir a la página de inicio">Home</a>
          </li>
          <li class="nav-item"><a class="nav-link" href="./nosotros.html"
              aria-label="Ir a la página Nosotros">Nosotros</a></li>
          <li class="nav-item"><a class="nav-link active" href="./contacto.html"
              aria-label="Ir a la página Contacto">Contacto</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!--Sección Contactanos-->
  <section class="formulario-contacto">
    <h1 class="titulo-contacto">Estemos en contacto</h1>
    <p class="subtitulo-contacto">Si tenés alguna consulta y necesitas asesoramiento, escribinos y te responderemos con
      gusto.</p>

    <!--Formularios-->
    <form class="formulario-1" action="/submit" method="post">

      <div class="form-nombre">
        <label for="name">Nombre y apellido *</label>
        <input type="text" id="name" name="name" required aria-required="true"
          aria-label="Campo para Nombre y Apellido">
      </div>

      <div class="form-email">
        <label for="email">Email *</label>
        <input type="email" id="email" name="email" required aria-required="true" aria-label="Campo para Email" />
      </div>

      <!-- Message field removed as per strict instruction -->

      <button type="submit" class="submit-button">Enviar</button>
    </form>

  </section>

  <!-- Subscribe & Footer Wrapper -->
  <div class="footer-wrapper">

    <!-- Floating Subscribe Card -->
    <div class="subscribe-card">
      <h2 class="subscribe-title">Suscríbete a Nuestro Newsletter</h2>
      <form class="subscribe-form" action="/subscribe" method="post">
        <input type="email" placeholder="Ingresa tu email" required>
        <button type="submit">Suscribirse Ahora</button>
      </form>
    </div>

    <!-- Main Footer -->
    <footer>
      <div class="container">

        <!-- Top Row: Links & Socials -->
        <div class="footer-top">
          <nav class="footer-nav">
            <a href="../index.html">Home</a>
            <a href="./nosotros.html">Nosotros</a>
            <a href="./contacto.html">Contacto</a>
          </nav>

          <div class="footer-socials">
            <a href="#" target="_blank"><img src="../recursos/instagram.svg" alt="Instagram"></a>
            <a href="#" target="_blank"><img src="../recursos/linkedin.svg" alt="LinkedIn"></a>
            <a href="#" target="_blank"><img src="../recursos/youtube.svg" alt="YouTube"></a>
          </div>
        </div>

        <hr class="footer-divider">

        <!-- Bottom Row: Copyright & Logo -->
        <div class="footer-bottom">
          <p class="copyright">© 2025 PopIT. Todos los derechos reservados.</p>

          <div class="footer-logo">
            <img src="../recursos/popit_logo_text.png" alt="PopIT Logo">
          </div>

          <div class="legal-links">
            <a href="#">Términos</a>
            <a href="#">Privacidad</a>
          </div>
        </div>

      </div>
    </footer>
  </div>

  <!-- Scripts de JavaScript (Optimizados: al final) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
